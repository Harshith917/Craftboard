services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-craftboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-craftboard}
      POSTGRES_DB: ${POSTGRES_DB:-craftboard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-craftboard} -d ${POSTGRES_DB:-craftboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-craftboard}:${POSTGRES_PASSWORD:-craftboard}@db:5432/${POSTGRES_DB:-craftboard}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      LIVEBLOCKS_SECRET_KEY: ${LIVEBLOCKS_SECRET_KEY}
      LIVEBLOCKS_WEBHOOK_SECRET: ${LIVEBLOCKS_WEBHOOK_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      FRONTEND_URLS: ${FRONTEND_URLS:-http://localhost:8080}
      PORT: 4001
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:latest}
    ports:
      - "${API_PORT:-4001}:4001"

  client:
    build:
      context: ./client
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4001}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${CLIENT_PORT:-8080}:80"

volumes:
  pgdata:
